[[cors]]
allowed_origins = "*"
allowed_methods = ["GET", "POST"]
allowed_headers = "*"

[[headers]]
for = ["**/*.woff2", "**/*.woff", "**/*.svg", "**/*.ttf", "**/*.otf", "**/*.eot", "**/*.js", "**/*.css"]
compress = "gzip"
[headers.values]
Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
for = ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif", "**/*.webp"]
[headers.values]
Cache-Control = "max-age=31536000, no-transform, public"

[[redirects]]
from = "/personnes/index.html"
to = "/lensemble/"

[[redirects]]
from = "/instruments/cistre-rennaissance/index.html"
to = "/lensemble/instruments/cistre-rennaissance/"

[[redirects]]
from = "/instruments/hardingfele/index.html"
to = "/lensemble/instruments/hardingfele/"

[[redirects]]
from = "/cistre-baroque/index.html"
to = "/lensemble/instruments/cistre-baroque/"

[[redirects]]
